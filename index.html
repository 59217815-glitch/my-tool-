<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0f">
<title>我的清单</title>
<style>
  body{margin:0;padding:24px 16px;padding-top:calc(24px + env(safe-area-inset-top));
       font:16px/1.6 -apple-system,"PingFang SC",sans-serif;background:#0b0b0f;color:#eee}
  h1{font-size:22px;margin:0 0 16px}
  form{display:flex;gap:8px;margin-bottom:16px}
  input{flex:1;padding:12px;border-radius:10px;border:1px solid #333;
        background:#16161c;color:#eee;font-size:16px}
  button{padding:12px 16px;border-radius:10px;border:0;background:#3b82f6;color:#fff;font-size:16px}
  li{display:flex;justify-content:space-between;gap:12px;padding:12px;margin-bottom:8px;
     background:#16161c;border-radius:10px;list-style:none}
  li.done span{opacity:.45;text-decoration:line-through}
  span{flex:1}
  .del{background:none;border:0;color:#888;font-size:18px}
  ul{padding:0;margin:0}
</style>
</head>
<body>
<h1>我的清单</h1>
<form id="f"><input id="i" placeholder="要做什么？" autocomplete="off"><button>加</button></form>
<ul id="l"></ul>
<script>
const KEY='my-list';
let items=JSON.parse(localStorage.getItem(KEY)||'[]');
const l=document.getElementById('l');
const save=()=>localStorage.setItem(KEY,JSON.stringify(items));
function render(){
  l.innerHTML='';
  items.forEach((t,idx)=>{
    const li=document.createElement('li');
    if(t.done) li.className='done';
    const s=document.createElement('span'); s.textContent=t.text;
    s.onclick=()=>{items[idx].done=!items[idx].done;save();render();};
    const b=document.createElement('button'); b.className='del'; b.textContent='×';
    b.onclick=()=>{items.splice(idx,1);save();render();};
    li.append(s,b); l.append(li);
  });
}
document.getElementById('f').onsubmit=e=>{
  e.preventDefault();
  const v=document.getElementById('i').value.trim();
  if(!v) return;
  items.push({text:v,done:false});
  document.getElementById('i').value='';
  save(); render();
};
render();
</script>
</body>
</html>
